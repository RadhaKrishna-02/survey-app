<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 3</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main id="app" class="wrap"></main><script src="js/data.js"></script><script src="js/te.js"></script><script src="js/app.js"></script><script>
const Y=['Yes','No'],fac=['Main Prayer / Worship Place','Prayer Hall / Assembly Hall','Drinking Water','Toilets','Electricity','Parking','Kitchen / Food Arrangement','Accommodation','Educational Facilities','Health-related Facilities','Community Hall'];
Form.run({id:'form3',title:'Form 3: Important religious place',repeat:true,titleKey:'name',newLabel:'Add religious place',add:'Add another',next:'form4',sections:[
 {title:'1. Basic information',fields:[F.tx('name','Name of religious place',{req:true}),F.dt('date','Date of data collection',{def:'today'}),F.tx('ward','Ward / hamlet / area'),
  F.rad('type','Type of religious place',['Temple','Mosque','Church','Gurudwara','Buddhist Vihara','Jain Derasar','Cemetery','Cremation / Funeral Site','Other'],{req:true}),F.tx('community','Related religion / community',{req:true}),F.ta('addr','Address / area'),F.gps('gps','GPS location',{req:true}),F.nm('estYear','Estimated year of establishment'),F.rad('exact','Is the exact year available?',['Yes','No','Estimated'])]},
 {title:'2. History',fields:[F.nm('year','Year established'),F.tx('by','Who established it?'),F.ta('purpose','Main purpose / background'),F.rad('rebuilt','Did the site exist earlier and was it reconstructed?',['Yes','No','Information Not Available']),F.nm('reYear','Year of reconstruction',{show:d=>d.rebuilt==='Yes'}),F.ta('reReason','Reason for reconstruction / expansion',{show:d=>d.rebuilt==='Yes'})]},
 {title:'3. Present use',fields:[F.rad('freq','How often is the site used?',['Daily','Weekly','Monthly','During Religious Festivals / Fairs','On Special Occasions','Other']),
  F.tbl('part','Participation',[N('n','Estimated number')],{rows:['Normal Day','Weekly Day','Major Religious Occasion'],lh:'Occasion'}),F.tbl('fest','Main religious festivals / occasions',[C('f','Festival / occasion')])]},
 {title:'4. Facilities',fields:[F.tbl('fac','Capacity and facilities',[C('has','Available?','sel',Y),C('det','Details')],{rows:fac,lh:'Facility'})]},
 {title:'5. Institutions',fields:[F.rad('inst','Any institution associated with this place?',Y),
  F.chk('itype','Type',['School','Hostel','College','Health Centre / Hospital','Orphanage','Old Age Home','Social Service Centre','Youth Centre',"Women's Centre",'Training Centre','Community Hall','Other'],{show:d=>d.inst==='Yes'}),
  F.tx('iname','Name of institution',{show:d=>d.inst==='Yes'}),F.nm('iyear','Year of establishment',{show:d=>d.inst==='Yes'}),F.nm('iserved','People currently receiving services',{show:d=>d.inst==='Yes'})]},
 {title:'6. Changes and visitors',fields:[F.chk('chg','Changes in the last 10-20 years',['New building constructed','Building expanded','New prayer / worship space created','Land area increased','New branch / centre started','New community facility started','Other','No Change']),F.nm('chgYear','Year of change'),F.ta('chgDet','Details'),
  F.rad('vis','Has the number of visitors changed in the last 10-20 years?',['Significant Increase','Slight Increase','No Major Change','Decrease','Information Not Available']),F.nm('visEarly','Estimated visitors earlier'),F.nm('visNow','Estimated visitors now')]},
 {title:'7. Population change',fields:[F.rad('pop','Has the related community population changed in 10-20 years?',['Increased','Decreased','Stable','Information Not Available']),
  F.chk('up','Possible reasons for increase',['Natural Population Growth','Migration from Other Areas','Inter-district Migration','Inter-state Migration','Marriage','Employment','Education','Other'],{show:d=>d.pop==='Increased'}),
  F.chk('down','Possible reasons for decrease',['Migration','Moving Out for Employment','Migration for Education','Urbanisation','Other'],{show:d=>d.pop==='Decreased'}),F.ta('popDet','Details')]},
 {title:'8. Photo and GIS',fields:[F.ph('photo','Photograph of the religious place',{req:true}),
  F.auto('gpsId','GPS location ID',(d,r)=>d.gps?'GPS-'+r.id+'-'+d.gps.ts.slice(0,10).replace(/-/g,''):''),F.auto('gis','Google Map / GIS reference',d=>d.gps?'https://www.google.com/maps?q='+d.gps.lat+','+d.gps.lng:''),
  F.chk('land','Land use around the site',['Residential','Agricultural','Forest','Industrial','Commercial','Educational','Other']),F.nm('dist','Distance to nearest main settlement (metres)'),F.tx('road','Nearest main road / highway'),F.tx('nearName','Name of place')]}]});

</script></body></html>
