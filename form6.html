<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 6</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main id="app" class="wrap"></main><script src="js/data.js"></script><script src="js/te.js"></script><script src="js/app.js"></script><script>
const MF=[N('m','Male'),N('f','Female'),R('t','Total')];
Form.run({id:'form6',title:'Form 6: Mortality and death rates',next:'form7',sections:[
 {title:'Basic indicators',fields:[F.tbl('basic','Basic mortality information',[N('v','Number / rate')],{rows:['Total Deaths','Male Deaths','Female Deaths','Infant Deaths (under 1 year)','Deaths of Children under 5 years','Maternal Deaths','Crude Death Rate','Infant Mortality Rate (IMR)','Under-Five Mortality Rate','Life Expectancy'],lh:'Indicator'})]},
 {title:'Deaths by age group',fields:[F.tbl('age','Deaths by age group',MF,{rows:['0-1 years','1-4 years','5-14 years','15-24 years','25-44 years','45-59 years','60-74 years','75 years and above'],lh:'Age group',calc:calc({add:['m','f','t']}),h:'Total is calculated automatically (Male + Female).'})]},
 {title:'Causes of death',fields:[F.tbl('cause','Main causes of death',MF,{rows:['Infectious Diseases','Heart / Cardiovascular Diseases','Cancer','Respiratory Diseases','Accidents','Old Age','Maternal Causes','Other','Total'],lh:'Cause',calc:calc({sum:['m','f'],add:['m','f','t']}),h:'Total is calculated automatically (Male + Female).'}),F.tx('common','Most common cause of death in the local area',{req:true}),
  F.rad('pattern','Has the pattern of mortality changed in 10-20 years?',['Yes','No','Slight Change','Information Not Available']),F.ta('pdet','If yes, main changes',{show:d=>d.pattern==='Yes'})]},
 {title:'Source and signature',fields:[F.rad('src','Source of information',['Birth and Death Registration Office (CRS)','Sample Registration System (SRS)','Health Department','Hospital Records','District Report','Field Survey','Other'],{req:true}),F.tx('ref','Source / report / table number'),F.tx('sign','Signature of data collector (type full name)',{req:true,def:'user'}),F.dt('date','Date',{req:true,def:'today'})]}]});

</script></body></html>
